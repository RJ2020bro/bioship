<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071319">
<title>BioShip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
 --ink:#071319;--deep:#0b1d25;--panel:#0e232c;--panel-2:#12303a;--line:#1e434d;--line-2:#2a5a64;
 --bone:#ede4cf;--bone-2:#c9bfa6;--muted:#8aa5a6;--dim:#5f7b7e;
 --glow:#8ff5cf;--glow-2:#4fd6b0;--amber:#e8b04f;--coral:#ff7a5c;--ok:#8ff5cf;
 --serif:"Fraunces",Georgia,"Times New Roman",serif;--sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
 --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--bone);font:16px/1.5 var(--sans);overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
[hidden]{display:none!important}
.mono{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
.serif{font-family:var(--serif)}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.ico{width:20px;height:20px;display:inline-block;vertical-align:middle}
.ico svg{width:100%;height:100%;display:block}

/* ---------- boot ---------- */
#boot{background:radial-gradient(120% 80% at 50% 40%,#0d2a33 0%,var(--ink) 70%);align-items:center;justify-content:flex-end;z-index:50;cursor:default}
#bootCv{position:absolute;inset:0;width:100%;height:100%}
.boot-foot{position:relative;width:min(440px,calc(100% - 32px));margin-bottom:calc(9vh + var(--safe-b));text-align:center}
.boot-tag{color:var(--muted);margin:0 0 14px;min-height:1.2em;transition:opacity .4s}
.boot-bar{height:1px;background:var(--line);overflow:hidden}
.boot-bar i{display:block;height:100%;width:0;background:var(--glow);box-shadow:0 0 8px var(--glow);transition:width .3s linear}
.boot-sub{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(1.05rem,2.6vw,1.3rem);color:var(--bone-2);margin:0 0 22px;opacity:0;transform:translateY(6px);transition:opacity .8s,transform .8s}
.boot-go{opacity:0;pointer-events:none;transition:opacity .6s}
.ready .boot-sub{opacity:1;transform:none}
.ready .boot-go{opacity:1;pointer-events:auto}
.ready .boot-bar,.ready .boot-tag{opacity:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 30px;border-radius:999px;border:1px solid var(--glow);color:var(--ink);background:var(--glow);font-weight:600;letter-spacing:.01em;box-shadow:0 0 0 0 rgba(143,245,207,.5),0 8px 30px -8px rgba(143,245,207,.55);transition:transform .15s,box-shadow .3s,background .2s}
.btn:hover{background:#b4ffe2}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--bone);border-color:var(--line-2);box-shadow:none}
.btn.ghost:hover{border-color:var(--glow);color:var(--glow)}
.btn.sm{min-height:40px;padding:0 18px;font-size:.92rem}
.boot-note{display:block;margin-top:14px;color:var(--dim)}

/* ---------- chart (map) ---------- */
#map{background:var(--ink)}
.chart-bg{position:absolute;inset:0;pointer-events:none;opacity:.5;background:
 radial-gradient(90% 60% at 50% 0%,#0f2e38 0%,transparent 70%),
 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='420'><g fill='none' stroke='%231a3d47' stroke-width='1'><path d='M-20 60 C80 20 160 110 260 70 S400 40 440 80'/><path d='M-20 140 C60 110 180 190 280 150 S410 120 440 160'/><path d='M-20 230 C90 190 170 280 270 240 S400 210 440 250'/><path d='M-20 320 C70 290 190 370 290 330 S410 300 440 340'/><path d='M-20 400 C80 370 160 450 260 410 S400 380 440 420'/></g><g fill='%231f4852'><circle cx='60' cy='300' r='1'/><circle cx='330' cy='90' r='1'/><circle cx='210' cy='200' r='1'/></g></svg>")}
.topbar{position:relative;z-index:3;display:flex;align-items:center;gap:12px;padding:calc(12px + var(--safe-t)) 16px 12px;background:linear-gradient(var(--ink) 60%,transparent)}
.wordmark{display:flex;flex-direction:column;line-height:1}
.wordmark b{font-family:var(--serif);font-style:italic;font-weight:600;font-size:1.65rem;letter-spacing:-.01em;font-variation-settings:"opsz" 144}
.wordmark span{color:var(--muted);margin-top:5px;font-size:.58rem;white-space:nowrap}
@media(max-width:380px){.wordmark span{display:none}}
.topbar .sp{flex:1}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);color:var(--bone-2);font-family:var(--mono);font-size:.8rem}
.pill .ico{width:15px;height:15px;color:var(--amber)}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--bone-2);transition:border-color .2s,color .2s}
.iconbtn:hover{border-color:var(--glow);color:var(--glow)}
.iconbtn .ico{width:19px;height:19px}
#routeWrap{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;z-index:1}
#route{position:relative;max-width:620px;margin:0 auto}
#route>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.leg{position:absolute;left:16px;right:16px;text-align:center;pointer-events:none}
.leg .mono{color:var(--glow);opacity:.85}
.leg h3{margin:4px 0 2px;font:italic 500 1.45rem/1.15 var(--serif)}
.leg p{margin:0;color:var(--muted);font-size:.86rem}
.leg:before{content:"";display:block;width:1px;height:18px;background:var(--line-2);margin:0 auto 8px}
.node{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;display:grid;place-items:center;font:500 1.15rem var(--serif);border:1px solid var(--line-2);background:var(--deep);color:var(--muted);transition:transform .2s,border-color .3s,background .3s}
.node:hover{transform:scale(1.06)}
.node.boss{width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:14px;transform:rotate(45deg)}
.node.boss>span{transform:rotate(-45deg);font-family:var(--mono);font-size:.62rem;letter-spacing:.12em}
.node.boss:hover{transform:rotate(45deg) scale(1.06)}
.node.done{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.node.open{background:var(--ink);color:var(--glow);border-color:var(--glow);box-shadow:0 0 0 6px rgba(143,245,207,.07),0 0 24px rgba(143,245,207,.35)}
.node.open:after{content:"";position:absolute;inset:-9px;border-radius:inherit;border:1px solid var(--glow);opacity:.0;animation:ping 2.4s ease-out infinite}
.node.locked{border-style:dashed;color:var(--dim);background:rgba(11,29,37,.7)}
@keyframes ping{0%{opacity:.7;transform:scale(.85)}100%{opacity:0;transform:scale(1.35)}}
.nlabel{position:absolute;transform:translateY(-50%);width:min(44vw,220px);pointer-events:none}
.nlabel.r{padding-left:44px}.nlabel.l{padding-right:44px;text-align:right}
.nlabel b{display:block;font:500 1.02rem/1.2 var(--serif)}
.nlabel span{display:block;color:var(--muted);font-size:.6rem;margin-top:3px}
.nlabel .stars{margin-top:4px;color:var(--amber);display:flex;gap:2px}
.nlabel.l .stars{justify-content:flex-end}
.nlabel .stars i{width:12px;height:12px;display:block}
.nlabel .stars i.off{color:var(--line-2)}
.locked+.nlabel{opacity:.5}
.route-end{position:absolute;left:0;right:0;text-align:center;color:var(--dim)}

/* ---------- sheet ---------- */
.veil{position:fixed;inset:0;z-index:30;background:rgba(3,10,14,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center}
.veil.on{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:min(560px,100%);max-height:88dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:26px 22px calc(22px + var(--safe-b));animation:rise .35s cubic-bezier(.2,.9,.3,1)}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
@media(min-width:720px){.veil{align-items:center}.sheet{border-radius:22px;border-bottom:1px solid var(--line)}}
.sheet .x{position:absolute;right:14px;top:14px}
.sheet h2{margin:6px 0 2px;font:500 2rem/1.1 var(--serif);letter-spacing:-.01em}
.sheet .sub{color:var(--muted);font-style:italic;font-family:var(--serif);margin:0 0 14px}
.sheet p{margin:0 0 14px;color:var(--bone-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 20px;font-size:.92rem}
.kv dt{color:var(--dim)}.kv dd{margin:0}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap}
.tag{color:var(--glow)}

/* ---------- play ---------- */
#play{background:var(--ink)}
.stage{position:relative;flex:0 0 auto;height:clamp(210px,40dvh,420px);overflow:hidden;isolation:isolate}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#cvBack{z-index:0}#cvFront{z-index:5;pointer-events:none}
#isl,#obs,#shipPos{position:absolute;z-index:2}
#isl svg,#obs svg{width:100%;height:auto;display:block;overflow:visible}
#isl{transition:opacity .8s}
#obs{z-index:3;animation:loom 5s ease-in-out infinite}
#obs .ghostship{transform:scaleX(-1);opacity:.85}
#obs .ghostship svg{width:100%;display:block}
@keyframes loom{50%{transform:translateY(-6px)}}
#shipPos{z-index:4;transition:left 1.3s cubic-bezier(.4,0,.2,1)}
#shipBob svg{width:100%;height:auto;display:block;overflow:visible}
#shipBob.hit{animation:shake .5s}
@keyframes shake{20%{translate:-10px 0;rotate:-6deg}50%{translate:9px 0;rotate:5deg}80%{translate:-4px 0;rotate:-2deg}}
#shipPos.sink #shipBob{transition:transform 1.6s ease-in,opacity 1.6s;transform:translateY(90px) rotate(28deg)!important;opacity:0}
.hud{position:absolute;z-index:6;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:10px;padding:calc(10px + var(--safe-t)) 12px 26px;pointer-events:none;background:linear-gradient(rgba(7,19,25,.62),rgba(7,19,25,.25) 65%,transparent)}
.hud>*{pointer-events:auto}
.hud .iconbtn{background:rgba(7,19,25,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hud-title{flex:1;min-width:0;text-shadow:0 1px 12px rgba(0,0,0,.6)}
.hud-title .mono{color:var(--bone-2);opacity:.85;font-size:.6rem}
.hud-title b{display:block;font:500 clamp(1.15rem,3vw,1.5rem)/1.15 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:flex;gap:5px;margin-top:7px}
.prog i{width:22px;height:4px;border-radius:2px;background:rgba(237,228,207,.22);transition:background .4s,box-shadow .4s}
.prog i.on{background:var(--glow);box-shadow:0 0 8px var(--glow)}
.bosshp{margin-top:8px;width:min(220px,48vw);height:5px;border-radius:3px;background:rgba(237,228,207,.18);overflow:hidden}
.bosshp i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--amber));transition:width .6s cubic-bezier(.4,0,.2,1)}
.hullbox{display:flex;gap:4px;padding:8px 10px;border-radius:999px;background:rgba(7,19,25,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(237,228,207,.12)}
.hullbox i{width:22px;height:15px;color:var(--bone);transition:color .3s,opacity .3s,transform .3s}
.hullbox i.lost{color:var(--coral);opacity:.35;transform:rotate(14deg) scale(.86)}
.hullbox i svg{width:100%;height:100%;display:block}
.stage .flash{position:absolute;inset:0;z-index:7;pointer-events:none;background:radial-gradient(circle at 30% 70%,rgba(255,122,92,.45),transparent 60%);opacity:0}
.stage .flash.go{animation:fl .6s}
@keyframes fl{0%{opacity:1}100%{opacity:0}}

.deck{position:relative;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--panel);border-top:1px solid var(--line);padding:0 16px calc(16px + var(--safe-b))}
.deck-in{max-width:680px;margin:0 auto}
.timer{position:sticky;top:0;height:3px;margin:0 -16px;background:var(--line);z-index:2}
.timer i{display:block;height:100%;width:100%;background:var(--glow);box-shadow:0 0 10px var(--glow);transform-origin:left;transition:background .3s}
.timer.warn i{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.timer.crit i{background:var(--coral);box-shadow:0 0 10px var(--coral)}
.qmeta{display:flex;align-items:center;gap:10px;padding:14px 0 6px;color:var(--muted)}
.qmeta .sp{flex:1}
.qmeta .secs{font-family:var(--mono);font-size:.85rem;color:var(--bone-2);min-width:3ch;text-align:right}
.qmeta .tag{font-size:.62rem}
#qText{font:400 clamp(1.12rem,2.4vw,1.32rem)/1.42 var(--serif);margin:4px 0 16px;letter-spacing:-.003em}
.opts{display:grid;gap:9px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--deep);font-size:1rem;line-height:1.35;transition:border-color .15s,background .2s,opacity .3s,transform .1s}
.opt:hover:not(:disabled){border-color:var(--line-2);background:#10272f}
.opt:active:not(:disabled){transform:scale(.99)}
.opt .k{flex:0 0 26px;height:26px;border-radius:7px;display:grid;place-items:center;font-family:var(--mono);font-size:.78rem;color:var(--muted);border:1px solid var(--line-2);margin-top:-1px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--glow);background:rgba(143,245,207,.1)}
.opt.right .k{background:var(--glow);color:var(--ink);border-color:var(--glow)}
.opt.wrong{border-color:var(--coral);background:rgba(255,122,92,.1)}
.opt.wrong .k{background:var(--coral);color:var(--ink);border-color:var(--coral)}
.opt.fade{opacity:.4}
.opt.gone{opacity:.18;text-decoration:line-through}
@media(min-width:620px){.opts{grid-template-columns:1fr 1fr}}
.charms{display:flex;gap:8px;margin:16px 0 4px}
.charm{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:12px;border:1px solid var(--line);color:var(--bone-2);font-size:.86rem;transition:border-color .2s,color .2s,background .2s}
.charm .ico{width:18px;height:18px}
.charm b{font-family:var(--mono);font-weight:500;color:var(--muted)}
.charm:hover:not(:disabled){border-color:var(--glow);color:var(--glow)}
.charm:disabled{opacity:.35;cursor:default}
.charm.armed{border-color:var(--amber);color:var(--amber);background:rgba(232,176,79,.08)}
.fb{margin-top:16px;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--deep);animation:rise .3s cubic-bezier(.2,.9,.3,1)}
.fb .verdict{font:500 1.15rem/1.2 var(--serif);margin:0 0 6px}
.fb .verdict.ok{color:var(--glow)}.fb .verdict.no{color:var(--coral)}
.fb p{margin:0 0 8px;color:var(--bone-2);font-size:.95rem}
.fb .src{color:var(--dim);font-size:.6rem;margin:10px 0 14px}
.fb .btn{width:100%}

/* desktop: stage beside the deck */
@media(min-width:1000px) and (min-height:560px){
 #play{flex-direction:row}
 .stage{flex:1.35 1 0;height:auto}
 .deck{flex:1 1 0;max-width:560px;border-top:0;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
 .deck-in{width:100%}
 .timer{position:absolute;top:0;left:0;right:0;margin:0}
 .opts{grid-template-columns:1fr}
}

/* ---------- landfall / overlays ---------- */
.over{position:fixed;inset:0;z-index:40;display:none;overflow-y:auto;background:radial-gradient(100% 70% at 50% 20%,#123540 0%,var(--ink) 75%)}
.over.on{display:block;animation:fade .4s}
.over-in{max-width:620px;margin:0 auto;padding:calc(28px + var(--safe-t)) 20px calc(30px + var(--safe-b));text-align:center}
.over h1{margin:8px 0 4px;font:500 clamp(2.1rem,7vw,3.1rem)/1.04 var(--serif);letter-spacing:-.015em;font-variation-settings:"opsz" 144}
.over .sub{margin:0;color:var(--muted);font-family:var(--serif);font-style:italic}
.starrow{display:flex;justify-content:center;gap:8px;margin:18px 0 6px;color:var(--amber)}
.starrow i{width:30px;height:30px;opacity:0;transform:scale(.3) rotate(-30deg);animation:pop .5s cubic-bezier(.2,1.6,.4,1) forwards}
.starrow i.off{color:var(--line-2)}
.starrow i:nth-child(2){animation-delay:.18s}.starrow i:nth-child(3){animation-delay:.36s}
@keyframes pop{to{opacity:1;transform:none}}
.morph{position:relative;width:min(320px,80vw);aspect-ratio:212/144;margin:16px auto 6px}
.morph>div{position:absolute;inset:0}
.morph svg{width:100%;height:100%;display:block;overflow:visible}
.morph canvas{position:absolute;inset:-30%;width:160%;height:160%;pointer-events:none}
.morph .old{animation:dissolve 1s .7s forwards}
.morph .new{opacity:0;animation:assemble 1.1s 1.45s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes dissolve{to{opacity:0;filter:blur(8px);transform:translateY(-8px) scale(1.04)}}
@keyframes assemble{from{opacity:0;filter:blur(10px) brightness(2);transform:scale(.92)}to{opacity:1;filter:none;transform:none}}
.morph .wl{position:absolute;left:-6%;right:-6%;top:78%;height:1px;background:linear-gradient(90deg,transparent,var(--glow),transparent);opacity:.5}
.shipname{margin:4px 0 2px;font:500 1.4rem/1.2 var(--serif)}
.shipname small{display:block;font-size:.95rem;color:var(--muted);font-style:italic}
.cards{text-align:left;display:grid;gap:12px;margin:22px 0}
.card{padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:rgba(14,35,44,.7)}
.card .mono{color:var(--glow);font-size:.6rem}
.card p{margin:6px 0 0;color:var(--bone-2)}
.reward{display:inline-flex;align-items:center;gap:8px;margin:0 0 22px;padding:8px 14px;border-radius:999px;border:1px solid var(--amber);color:var(--amber);font-size:.9rem}
.reward .ico{width:17px;height:17px}
.over .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- logbook ---------- */
.tabs{display:flex;gap:6px;justify-content:center;margin:18px 0 20px}
.tabs button{padding:9px 16px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:.9rem}
.tabs button.on{border-color:var(--glow);color:var(--glow)}
.loglist{display:grid;gap:12px;text-align:left}
.entry{padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:rgba(14,35,44,.7)}
.entry h4{margin:4px 0 6px;font:500 1.25rem/1.2 var(--serif)}
.entry p{margin:0 0 8px;color:var(--bone-2);font-size:.94rem}
.entry p b{color:var(--bone);font-weight:500}
.entry.locked{opacity:.45}
.fleet{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.fleet .s{padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(14,35,44,.7);text-align:center;font-size:.82rem;color:var(--bone-2)}
.fleet .s svg{width:100%;height:auto;display:block;margin-bottom:6px}
.fleet .s.locked svg{filter:brightness(0) opacity(.35)}
.fleet .s.locked{color:var(--dim)}
.src-list{text-align:left;color:var(--bone-2);font-size:.94rem}
.src-list li{margin-bottom:10px}
.src-list a{color:var(--glow)}
.settings{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));z-index:60;transform:translateX(-50%) translateY(20px);opacity:0;padding:10px 16px;border-radius:999px;background:var(--bone);color:var(--ink);font-size:.9rem;transition:opacity .3s,transform .3s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<!-- boot -->
<section class="screen on" id="boot">
 <canvas id="bootCv"></canvas>
 <div class="boot-foot">
  <p class="boot-sub">A voyage across twenty-one islands of myth, and everything alive between them.</p>
  <p class="boot-tag mono" id="bootTag">Culturing plankton</p>
  <div class="boot-bar"><i id="bootBar"></i></div>
  <div class="boot-go"><button class="btn" id="bootGo">Set sail</button><span class="boot-note mono">Best with sound on</span></div>
 </div>

  const d=oc.getImageData(0,0,W,H).data;let pts=[],st=3;

 $$(".charm").forEach(b=>{const c=b.dataset.c,n=P.charms[c];b.querySelector("b").textContent=n;
  b.disabled=R.done||(c==="nacre"?(R.nacre||!n):!n)||(c==="lens"&&R.q&&R.q.lens);b.classList.toggle("armed",c==="nacre"&&R.nacre)});

function pickQ(){

 topics.forEach(t=>{const seen=P.seen[t]||[];QB[t].forEach((q,k)=>{const id=t+k;if(R.used.has(id))return;

 overlay(`<span class="mono tag">Ship’s logbook</span><h1>Logbook</h1><p class="sub">${P.ships.length} of 21 ships · ${Object.keys(P.stars).length} of ${NODES.length} waters cleared</p>
 <div class="tabs">${tab("islands")}${tab("fleet")}${tab("sources")}</div>${body}
 <div class="settings"><button class="btn ghost sm" id="sndBtn2">${Sound.on?"Sound: on":"Sound: off"}</button><button class="btn ghost sm" id="resetBtn">Reset voyage</button><button class="btn sm" id="closeLog">Back to the chart</button></div>`);
 $$("#overIn .tabs button").forEach(b=>b.onclick=()=>{logTab=b.dataset.t;Sound.fx("tap");openLog()});
 $("#closeLog").onclick=()=>{closeOver();renderMap()};
 $("#sndBtn2").onclick=()=>{Sound.init();Sound.toggle();sndIcon();$("#sndBtn2").textContent=Sound.on?"Sound: on":"Sound: off"};
 let armed=false;$("#resetBtn").onclick=()=>{if(!armed){armed=true;$("#resetBtn").textContent="Tap again to erase";setTimeout(()=>{armed=false;const b=$("#resetBtn");if(b)b.textContent="Reset voyage"},3000);return}
  P={unlocked:0,stars:{},ships:[],charms:{lens:1,nacre:1,tide:1},seen:{}};save();closeOver();renderMap();toast("Voyage reset.")};

$("#logBtn").onclick=()=>{Sound.fx("tap");openLog()};
$("#sndBtn").onclick=()=>{Sound.init();Sound.toggle();sndIcon()};

/* ---------------- keyboard ---------------- */
addEventListener("keydown",e=>{
 if(e.metaKey||e.ctrlKey||e.altKey)return;
 if($("#veil").classList.contains("on")){if(e.key==="Escape"){const s=$("#stayBtn");s?s.onclick():closeVeil()}return}
 if($("#over").classList.contains("on")){if(e.key==="Enter"&&document.activeElement.tagName!=="BUTTON"){const b=$("#contBtn")||$("#retryBtn")||$("#mapBtn");if(b){e.preventDefault();b.click()}}return}
 if(!$("#play").classList.contains("on")||!R)return;
 if(!R.done){const k="1234".indexOf(e.key)>=0?"1234".indexOf(e.key):"abcd".indexOf(e.key.toLowerCase());if(k>=0&&e.key.length===1){const b=$$(".opt")[k];if(b&&!b.disabled){e.preventDefault();answer(k)}}}
 else if((e.key==="Enter"||e.key===" ")&&document.activeElement.id!=="nextBtn"){e.preventDefault();advance()}
 if(e.key==="Escape")$("#leaveBtn").click();
});

fillIcons();sndIcon();boot();
