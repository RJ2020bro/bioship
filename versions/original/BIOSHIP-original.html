<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BIOSHIP</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Pirata+One&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--k:#2a2118;--paper:#fffdf2;--grn:#8fd44a;--gold:#f3b63f;--red:#e0523a;--parch:#ead9a6}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font:1.15rem "Patrick Hand",system-ui,sans-serif;color:var(--k);background:#f7f1d5 linear-gradient(#b9d39a88 1px,transparent 1px),linear-gradient(90deg,#b9d39a88 1px,transparent 1px);background-size:100% 26px,26px 100%;background-attachment:fixed}
h1,h2,.pf{font-family:"Pirata One",Georgia,serif;font-weight:400;letter-spacing:.04em}
#app{height:100dvh;display:flex;flex-direction:column;padding:10px 14px;gap:10px;max-width:1100px;margin:0 auto}
.top{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:var(--paper);border:3px solid var(--k);border-radius:14px;padding:6px 12px;box-shadow:4px 4px 0 var(--k)}
.stat{display:flex;flex-direction:column;align-items:center;line-height:1.1}.stat span{font-size:.78rem;opacity:.65;text-transform:uppercase;letter-spacing:.08em}.stat b{font-size:1.4rem;min-height:1.4rem}
.pips i{display:inline-block;width:16px;height:16px;margin:0 2px;background:#8a5a2b;border:3px solid var(--k);border-radius:5px;transition:.3s}.pips i.x{background:var(--red);transform:rotate(12deg) scale(.85)}
#track{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:-2px}
#track i{width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--k);transition:.4s}#track i.b{border-radius:2px}#track i.d{background:var(--grn)}#track i.n{background:var(--gold);transform:scale(1.5)}
.sea{position:relative;flex:1;min-height:170px;border:4px solid var(--k);border-radius:20px;overflow:hidden;box-shadow:5px 5px 0 var(--k);background:#3f9bd0}
.sea>*,#far>*{position:absolute}
.sky{left:0;right:0;top:0;height:60%;background:var(--sky);transition:background 1.2s}
.stars{left:0;right:0;top:0;height:58%;opacity:0;transition:opacity 1.2s;background:radial-gradient(2px 2px at 12% 20%,#fff,transparent),radial-gradient(2px 2px at 36% 44%,#fff,transparent),radial-gradient(2px 2px at 58% 14%,#fff,transparent),radial-gradient(2px 2px at 78% 36%,#fff,transparent),radial-gradient(2px 2px at 90% 12%,#fff,transparent)}
.night .stars{opacity:1}
#sun{top:14px;right:18px;width:46px;height:46px;border-radius:50%;background:#ffd34d;border:3px solid var(--k);transition:.8s}.night #sun{background:#f1eedd;box-shadow:inset -13px -4px 0 #cfc9a8}
.cl{top:30%;width:84px;height:24px;background:#fff;border:3px solid var(--k);border-radius:20px;animation:cl 45s linear infinite}.cl:before{content:"";position:absolute;left:14px;top:-18px;width:38px;height:32px;background:#fff;border:3px solid var(--k);border-bottom:0;border-radius:40px 40px 0 0}
.cl.b{top:12%;animation-duration:70s;animation-delay:-30s;transform:scale(.7)}
@keyframes cl{from{left:-110px}to{left:100%}}
.water{left:0;right:0;top:58%;bottom:0;background:linear-gradient(#3f9bd0,#1f6fa8);border-top:3px solid var(--k)}
.wv{left:0;right:0;height:30px;background-repeat:repeat-x;background-size:120px 30px;animation:wv 8s linear infinite}
.wv.a{bottom:32%;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='30'><path d='M0 15Q30 2 60 15T120 15V30H0Z' fill='%23a6dcf2' stroke='%232a2118' stroke-width='3'/></svg>")}
.wv.b{bottom:18%;animation-duration:6s;animation-direction:reverse;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='30'><path d='M0 15Q30 2 60 15T120 15V30H0Z' fill='%233f9bd0' stroke='%232a2118' stroke-width='3'/></svg>")}
.wv.c{bottom:0;height:46px;z-index:4;animation-duration:4s;background-size:120px 46px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='46'><path d='M0 12Q30 0 60 12T120 12V46H0Z' fill='%231f6fa8' stroke='%232a2118' stroke-width='3'/></svg>")}
@keyframes wv{to{background-position-x:-120px}}
#far{inset:0}#far.enter{animation:slin 1s cubic-bezier(.2,.9,.3,1)}@keyframes slin{from{transform:translateX(55%);opacity:0}}
#isl{right:3%;bottom:20%;width:clamp(110px,15vw,200px);z-index:1;transition:filter 1s}#isl svg{width:100%;display:block}
#obs{right:20%;bottom:16%;width:clamp(130px,18vw,260px);z-index:2}.mon{animation:loom 3s ease-in-out infinite}.mon svg{width:100%;display:block;overflow:visible}
@keyframes loom{50%{transform:translateY(-8px) rotate(-2deg)}}
#ship{bottom:10%;width:clamp(120px,16vw,220px);z-index:3;transition:left 1.2s cubic-bezier(.4,0,.2,1),transform 1.2s ease-in,opacity 1.2s;animation:bob 2.6s ease-in-out infinite}#ship svg{width:100%;display:block;overflow:visible}
@keyframes bob{50%{transform:translateY(6px) rotate(2.5deg)}}
#ship.hit{animation:shake .5s}@keyframes shake{25%{transform:translateX(-14px) rotate(-7deg)}75%{transform:translateX(14px) rotate(7deg)}}
#ship.sink{animation:none;transform:translateY(110px) rotate(40deg);opacity:0}
#fx{right:24%;bottom:36%;width:96px;height:96px;z-index:5;opacity:0;clip-path:polygon(50% 0,61% 20%,82% 10%,78% 33%,100% 40%,82% 56%,95% 78%,72% 76%,65% 100%,50% 82%,35% 100%,28% 76%,5% 78%,18% 56%,0 40%,22% 33%,18% 10%,39% 20%)}
#fx.hit{background:var(--gold)}#fx.dmg{background:var(--red)}#fx.pop{animation:pop .7s}
@keyframes pop{0%{opacity:1;transform:scale(.2) rotate(-30deg)}45%{opacity:1;transform:scale(1.4) rotate(8deg)}100%{opacity:0;transform:scale(1.7) rotate(14deg)}}
.sea:after{content:"";position:absolute;inset:0;background:#e0523a77;opacity:0;pointer-events:none;z-index:6}.sea.flash:after{animation:fl .5s}@keyframes fl{0%{opacity:1}100%{opacity:0}}
#banner{left:12px;top:12px;z-index:7;background:var(--parch);border:3px solid var(--k);border-radius:6px;padding:6px 14px 8px;transform:rotate(-1.5deg);box-shadow:3px 3px 0 var(--k);min-width:190px;max-width:70%}
#btitle{font:1.6rem "Pirata One",serif;line-height:1.1}#bsub{font-size:.95rem;opacity:.8}
.hp{height:13px;border:3px solid var(--k);background:#fff;border-radius:8px;overflow:hidden;margin-top:5px}.hp i{display:block;height:100%;background:var(--red);transition:width .7s cubic-bezier(.4,0,.2,1)}
.panel{background:var(--paper);border:4px solid var(--k);border-radius:18px;padding:14px 16px;box-shadow:5px 5px 0 var(--k);max-height:46vh;overflow:auto}
.meta{display:flex;justify-content:space-between;font-size:.95rem;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.meta i{display:inline-block;width:11px;height:11px;margin-left:4px;border:2px solid var(--k);border-radius:50%}.meta i.on{background:var(--red)}
#q{font-size:clamp(1.1rem,1.7vw,1.45rem);line-height:1.4;margin:8px 0 10px;min-height:3.2em}
#tm{height:10px;border:2px solid var(--k);border-radius:6px;background:#fff;overflow:hidden;margin-bottom:10px}#tmb{display:block;height:100%;width:100%;background:#2b9e57;transition:width .25s linear,background .3s}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
input{flex:1;min-width:150px;font:1.35rem "Patrick Hand",sans-serif;padding:8px 14px;border:3px solid var(--k);border-radius:12px;background:#fff;color:var(--k)}input:focus{outline:3px solid #8fd44a88}
button{font:1.25rem "Patrick Hand",sans-serif;cursor:pointer;padding:7px 18px;border:3px solid var(--k);border-radius:14px;background:#fff;color:var(--k);box-shadow:0 4px 0 var(--k);transition:transform .08s,box-shadow .08s}
button.go{background:linear-gradient(#b4e86a,#7ac943);font-weight:bold}button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--k)}button:disabled{opacity:.45;cursor:default}[hidden]{display:none!important}
#fb{margin-top:10px;line-height:1.45}.ok{color:#1f7a3d}.bad{color:#b3261e}
.ov{position:fixed;inset:0;background:#2a211899;display:none;align-items:center;justify-content:center;padding:18px;z-index:9;backdrop-filter:blur(2px)}.ov.on{display:flex}
.box{background:var(--paper);border:4px solid var(--k);border-radius:20px;box-shadow:6px 6px 0 var(--k);padding:24px;text-align:center;max-width:460px;animation:pop2 .45s cubic-bezier(.2,1.4,.4,1)}@keyframes pop2{from{transform:scale(.8) translateY(20px);opacity:0}}
.box h2{margin:6px 0;font-size:2.2rem}.box p{margin:8px 0 14px}
#home{z-index:20;background:#f7f1d5 linear-gradient(#b9d39a88 1px,transparent 1px),linear-gradient(90deg,#b9d39a88 1px,transparent 1px);background-size:100% 26px,26px 100%;backdrop-filter:none}
#home h1{font-size:clamp(3.4rem,11vw,6.5rem);margin:0;line-height:1;text-shadow:4px 4px 0 var(--gold),-2px -2px 0 #fff}
#hship{width:200px;margin:0 auto;animation:bob 2.6s ease-in-out infinite}#hship svg{width:100%}
#tr{z-index:15;background:radial-gradient(#2d5f8f,#14304f);backdrop-filter:none;color:#fff;text-align:center}#tr h2{font-size:2.6rem;margin:6px 0;text-shadow:3px 3px 0 var(--k)}
#trship{width:min(300px,70vw);margin:10px auto}#trship svg{width:100%;overflow:visible}
.build g{opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:asm .7s cubic-bezier(.2,1.5,.4,1) forwards}.build .p1{animation-delay:.3s;--y:70px}.build .p2{animation-delay:.8s;--y:-70px}.build .p3{animation-delay:1.3s;--y:0px;transform:scaleY(.1)}.build .p4{animation-delay:1.8s;--y:-30px}
@keyframes asm{from{opacity:0;transform:translateY(var(--y)) scale(.85)}to{opacity:1;transform:none}}
.lv{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:112px;height:112px;border-radius:50%;background:var(--gold);color:var(--k);border:4px solid var(--k);box-shadow:4px 4px 0 var(--k);animation:lvl .9s .1s both cubic-bezier(.2,1.6,.4,1)}.lv span{font-size:.9rem;text-transform:uppercase;letter-spacing:.1em}.lv b{font:2.4rem "Pirata One",serif;line-height:1}
.lv:after{content:"";position:absolute;inset:-6px;border:4px solid var(--gold);border-radius:50%;animation:ring 1s .9s both}
@keyframes lvl{from{transform:scale(0) rotate(-25deg)}}@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.9);opacity:0}}
#trb{animation:fin .5s 2.4s both}@keyframes fin{from{opacity:0;transform:translateY(10px)}}
@media(max-width:560px){.top{grid-template-columns:repeat(3,1fr)}#banner{max-width:78%}}
</style></head><body>
<div id="app">
<header class="top"><div class="stat"><span>Hull</span><b class="pips" id="hull"></b></div><div class="stat"><span>Level</span><b id="lvl"></b></div><div class="stat"><span>Gold</span><b id="gold"></b></div><div class="stat"><span>Shield</span><b id="shd"></b></div><div class="stat"><span>Time</span><b id="clock"></b></div></header>
<div id="track"></div>
<section class="sea" id="sea"><div class="sky"></div><div class="stars"></div><div id="sun"></div><div class="cl"></div><div class="cl b"></div><div class="water"></div><div class="wv a"></div>
<div id="far"><div id="isl"><svg viewBox="0 0 120 100"><g stroke="#2a2118" stroke-width="4" stroke-linejoin="round"><path d="M0 92Q20 58 60 58Q100 58 120 92Z" fill="#e8c27a"/><path d="M18 78Q38 60 60 60Q86 60 102 78Q60 70 18 78Z" fill="#6cc04a"/><path d="M62 60Q72 40 66 22" fill="none" stroke-width="6"/><path d="M66 22Q50 12 38 26Q56 20 66 22ZM66 22Q84 10 96 24Q78 20 66 22ZM66 22Q60 4 50 2Q60 12 66 22Z" fill="#3fa84a"/></g></svg></div><div id="obs"><div class="mon"></div></div></div>
<div class="wv b"></div><div id="ship"></div><div id="fx"></div><div class="wv c"></div>
<div id="banner"><div id="btitle"></div><div id="bsub"></div><div class="hp"><i id="hpb"></i></div></div></section>
<section class="panel"><div class="meta"><span id="unit"></span><span id="diff"></span></div><p id="q"></p><div id="tm"><i id="tmb"></i></div>
<div class="row"><input id="ans" autocomplete="off" placeholder="Type your answer"><button id="fire" class="go">Submit</button></div>
<div class="row"><button id="hint"></button><button id="skip"></button><button id="next" class="go" hidden>Next</button></div><div id="fb"></div></section></div>
<div class="ov on" id="home"><div class="box" style="background:none;border:0;box-shadow:none"><div id="hship"></div><h1>BIOSHIP</h1><p>College biology tossups across myth-haunted seas.<br>30 seconds per clue. Three correct answers reach an island. A boss guards every third one.</p><button id="play" class="go" style="font-size:1.8rem;padding:10px 46px">Play</button></div></div>
<div class="ov" id="tr"><div class="box" style="background:none;border:0;box-shadow:none"><div id="trl"></div><div id="trship"></div><h2 id="trn"></h2><div id="trs"></div><p id="trp"></p><button id="trb" class="go">Set sail</button></div></div>
<div class="ov" id="ov"><div class="box"><h2 id="ovt"></h2><p id="ovp"></p><button id="ovb" class="go">OK</button></div></div>
<script>
const Q=[
["Replication","This enzyme class forms a transient covalent phosphotyrosine link with DNA; type II members hydrolyze ATP to pass one duplex through a break in another. Bacterial versions are poisoned by fluoroquinolones. For 10 points, name these enzymes that relieve supercoiling.","topoisomerase,topoisomerases,gyrase","Topoisomerases cut and reseal DNA to relax supercoils."],
["Replication","Meselson and Stahl used 15N and cesium chloride density gradients to rule out the conservative and dispersive models. For 10 points, name the mode of DNA replication they confirmed.","semiconservative,semi-conservative","Each daughter duplex keeps one parental strand."],
["Expression","This hexameric ATP-dependent RNA translocase binds C-rich rut sites on nascent transcripts and chases the polymerase off the template. For 10 points, name this bacterial termination factor, a Greek letter.","rho","Rho-dependent termination."],
["Expression","U1 snRNP base-pairs at the 5' splice site while U2AF binds the polypyrimidine tract. The branchpoint adenosine's 2' hydroxyl attacks first, yielding a lariat. For 10 points, name this ribonucleoprotein machine.","spliceosome","Removes introns by two transesterifications."],
["Expression","Ambros and Ruvkun found lin-4 in C. elegans, the first of these ~22-nucleotide RNAs, which are processed by Dicer and loaded onto Argonaute to repress translation via imperfect pairing with 3' UTRs. Name this class.","microrna,mirna,micro rna","miRNAs silence genes post-transcriptionally."],
["Expression","In this bacterial mechanism, a leader peptide containing tandem trp codons lets a stalled or moving ribosome decide whether a terminator hairpin forms in the trp operon. For 10 points, name this regulatory process.","attenuation","Ribosome position controls hairpin formation."],
["Cell","Flippases normally confine this anionic phospholipid to the inner leaflet; its exposure marks apoptotic cells as an 'eat-me' signal, and annexin V binds it. Name this phospholipid.","phosphatidylserine,ps","Exposed PS flags cells for phagocytosis."],
["Cell","This three-legged triskelion protein assembles polyhedral cages on vesicles budding from the plasma membrane, recruited by AP2 adaptors. For 10 points, name this coat protein of receptor-mediated endocytosis.","clathrin","Clathrin-coated pits."],
["Cell","Ritossa observed puffs in Drosophila polytene chromosomes after heat shock, leading to Hsp70 and the GroEL/GroES barrel. For 10 points, name this class of proteins that assist folding of other proteins.","chaperone,chaperones,chaperonin,chaperonins","Chaperones prevent misfolding and aggregation."],
["Cell","Encoded on chromosome 13q14, this tumor suppressor binds E2F when hypophosphorylated and blocks the G1/S transition. Its loss causes a childhood eye cancer. Name this protein, abbreviated with two letters.","rb,retinoblastoma","Rb is phosphorylated by cyclin D/CDK4."],
["Energetics","Peter Mitchell proposed in 1961 that electron transport couples to ATP synthesis through an electrochemical proton gradient across a membrane. For 10 points, name this theory.","chemiosmosis,chemiosmotic theory,chemiosmotic","Proton-motive force drives ATP synthase."],
["Energetics","Cyanide, azide and carbon monoxide inhibit this heme- and copper-containing enzyme that reduces O2 to water. For 10 points, name this terminal complex of the electron transport chain.","cytochrome c oxidase,cytochrome oxidase,complex iv,complex 4","Complex IV passes four electrons to O2."],
["Energetics","This four-carbon compound is regenerated at the end of the citric acid cycle, condenses with acetyl-CoA, and is the product of PEP carboxylase in C4 plants. Name it.","oxaloacetate,oxaloacetic acid","Oxaloacetate is the citric acid cycle acceptor."],
["Energetics","Calvin used Chlorella and radioactive carbon-14 to find this three-carbon acid, the first stable product when rubisco fixes CO2 onto RuBP. Name it.","3-phosphoglycerate,phosphoglycerate,3pg,pga","RuBP + CO2 splits into two 3-PGA."],
["Energetics","Rubisco's oxygenase activity makes phosphoglycolate, a process involving peroxisomes and mitochondria that consumes O2 and wastes energy in light. Name this process.","photorespiration","C4 and CAM plants minimize it."],
["Energetics","This megacomplex of E1, E2 and E3 needs thiamine pyrophosphate, lipoate, CoA, FAD and NAD+ to convert pyruvate to acetyl-CoA. Name this enzyme complex.","pyruvate dehydrogenase,pdh,pdc,pyruvate dehydrogenase complex","The link reaction between glycolysis and the citric acid cycle."],
["Genetics","Xist RNA coats one chromosome in female mammals, silencing it as a Barr body. This phenomenon produces calico cats. For 10 points, name it.","x inactivation,x-inactivation,lyonization","Random silencing of one X in each cell."],
["Genetics","Barbara McClintock discovered Ac and Ds in maize: DNA segments that move by cut-and-paste or copy-and-paste. For 10 points, name these elements, nicknamed 'jumping genes'.","transposon,transposons,transposable elements,transposable element","Transposons cause mutations and genome rearrangement."],
["Genetics","This four-stranded DNA intermediate of homologous recombination branch-migrates and is resolved by resolvases. Name it, after a British geneticist's 1964 model.","holliday,holliday junction","Resolution gives crossover or non-crossover products."],
["Evolution","Sickle-cell allele frequency stays high in malarial regions because the Hb AS carrier has higher fitness than either homozygote. For 10 points, name this form of balancing selection, two words.","heterozygote advantage,overdominance,heterozygous advantage","Selection maintains both alleles."],
["Evolution","Leigh Van Valen proposed that lineages must keep evolving merely to maintain fitness against evolving enemies, naming it for a Carroll character. Name this hypothesis.","red queen,red queen hypothesis","Coevolutionary arms race."],
["Evolution","These genes contain a 180 bp DNA-binding motif and are colinear along chromosomes, specifying anterior-posterior identity; Antennapedia mutants grow legs from the head. Name these genes.","hox,hox genes,homeotic genes,homeobox","Hox genes pattern the body axis."],
["Evolution","Motoo Kimura's neutral theory holds that most fixed molecular differences arise through this stochastic process rather than selection. Name it.","genetic drift,drift","Random sampling of alleles."],
["Ecology","Robert Paine removed Pisaster ochraceus from tidal pools and watched mussels crowd out other species. For 10 points, name this kind of species with outsized effect.","keystone,keystone species","Removal collapses diversity."],
["Ecology","Hamilton's rule, rB > C, explains how altruism toward relatives evolves, as in sterile worker bees. Name this type of selection.","kin selection,inclusive fitness","Genes are favored via relatives."],
["Physiology","This pump moves 3 Na+ out and 2 K+ in per ATP, and is inhibited by ouabain and digoxin. For 10 points, name this P-type ATPase.","sodium potassium pump,sodium potassium atpase,na k atpase,sodium-potassium pump,na+ k+ atpase","It sets the resting potential gradient."],
["Physiology","This principal excitatory CNS neurotransmitter acts on NMDA and AMPA receptors; NMDA channels need relief of a Mg2+ block and underlie long-term potentiation. Name it.","glutamate,glutamic acid","Glutamate drives LTP."],
["Physiology","This pentameric antibody with a J chain is first secreted in a primary response and activates complement efficiently. Name this isotype.","igm","IgM is the first responder."],
["Physiology","This law states that stroke volume rises with end-diastolic volume because of greater myocardial fiber stretch. Name it, after two physiologists (either name).","frank-starling,frank starling,starling,frank","Stretch increases contraction force."],
["Plants","Went used oat coleoptile tips and agar blocks to show this hormone moves basipetally via PIN proteins and drives acid growth. Name this hormone.","auxin,iaa","Indole-3-acetic acid."],
["Plants","Long sought by Chailakhyan, this mobile flowering signal is now identified as the FT protein moving through phloem to the apex. Name this hypothetical hormone.","florigen","Florigen is the FT protein."],
["Diversity","Woese's comparison of 16S rRNA sequences revealed this domain, whose members resemble eukaryotes in transcription machinery but lack peptidoglycan. Name it.","archaea,archaebacteria","The third domain of life."],
["Diversity","This genus's Ti plasmid transfers T-DNA into plant cells and is the workhorse vector of plant transformation. Name the bacterium.","agrobacterium,agrobacterium tumefaciens","Causes crown gall tumors."],
["Chemistry","Only this amino acid's side chain loops back to the backbone nitrogen, breaking alpha helices; its cis-trans isomerization is catalyzed by peptidyl-prolyl isomerases. Name it.","proline","Proline is a helix breaker."],
["Chemistry","This kinetic constant equals the substrate concentration at which an enzyme reaches half of Vmax. Name it, symbolized K sub M.","km,michaelis constant,michaelis-menten constant","A low Km means high affinity."],
["Chemistry","This secondary structure has 3.6 residues per turn and hydrogen bonds from residue i to i+4. Name it.","alpha helix,alpha-helix,helix"],
["Chemistry","Hemoglobin's sigmoidal oxygen-binding curve reflects this phenomenon, in which binding at one subunit raises affinity at the others. Name it.","cooperativity,cooperative binding"],
["Chemistry","Low pH and high CO2 lower hemoglobin's oxygen affinity in this effect, named for a Danish physiologist. Name it.","bohr effect,bohr"],
["Chemistry","This entropy-driven effect buries nonpolar side chains in a protein core as water is released. Name it.","hydrophobic effect,hydrophobic interaction,hydrophobic"],
["Chemistry","A double-reciprocal plot of 1/v against 1/[S] linearizes Michaelis-Menten data. Name it after two biochemists (either name).","lineweaver-burk,lineweaver burk,lineweaver,burk,double reciprocal"],
["Chemistry","Phospholipids possess hydrophilic heads and hydrophobic tails. Give this adjective, which starts with 'amphi'.","amphipathic,amphiphilic"],
["Chemistry","A reaction with negative delta G that proceeds spontaneously is described by this term. Name it.","exergonic,spontaneous"],
["Cell","Mutations in lamin A, a component of this meshwork inside the nuclear envelope, cause progeria. Name this structure.","nuclear lamina,lamina"],
["Cell","Importins recognize this short basic amino acid sequence on cargo proteins to bring them through nuclear pores. Name it, or its abbreviation.","nuclear localization signal,nls"],
["Cell","A gradient of the GTP-bound form of this small GTPase across the nuclear envelope gives nuclear transport its direction. Name it.","ran"],
["Cell","Claudins and occludins form belts of these junctions that seal epithelial sheets and block paracellular leakage. Name them.","tight junctions,tight junction"],
["Cell","Cadherins link neighboring cells' intermediate filaments at these spot-like anchoring junctions in skin and heart. Name them.","desmosomes,desmosome"],
["Cell","Desmotubules run through these plasma-membrane-lined channels in plant cell walls. Name them.","plasmodesmata,plasmodesma"],
["Cell","Insulin receptors autophosphorylate this amino acid on their cytoplasmic domains, creating SH2-domain docking sites. Name it.","tyrosine"],
["Cell","This enzyme, activated by Gq, cleaves PIP2 into IP3 and diacylglycerol. Name it.","phospholipase c,plc"],
["Cell","This four-EF-hand protein senses calcium and activates CaM kinases. Name it.","calmodulin"],
["Cell","Mannose-6-phosphate tags direct hydrolases from the Golgi to this acidic organelle. Name it.","lysosome,lysosomes"],

function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?0:j}
for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return m[a.length][b.length]}
function has(text,words,kw){if(text.includes(kw))return true;const tol=kw.length<5?0:kw.length<9?1:2;if(!tol)return false;
const n=kw.split(" ").length;for(let i=0;i+n<=words.length;i++){if(lev(words.slice(i,i+n).join(" "),kw)<=tol)return true}return false}

else if(S.shield){S.shield--;hitFx();m=`<b class="bad">${pre}Your shield absorbs the hit.</b>`}
else{S.bad++;hitFx();m=`<b class="bad">${pre}Your ship takes damage.</b>`}
say(m+`<br>Answer: <b>${cur[2].split(",")[0]}</b>${cur[3]?" — "+cur[3]:""}`);$("ans").value="";phase="result";
$("next").textContent=S.bad>=lim()?"Continue":S.ok>=need()?(STG[S.st].b?"Claim victory":"Make landfall"):"Next question";render()}
function next(){if(S.bad>=lim())return sink();if(S.ok>=need())return clearStage();cur=draw(tier());phase="ask";say("");render()}
function ov(t,p,b,f){$("ovt").textContent=t;$("ovp").textContent=p;$("ovb").textContent=b;$("ovb").onclick=()=>{$("ov").classList.remove("on");f()};$("ov").classList.add("on")}
function sink(){$("ship").classList.add("sink");setTimeout(()=>ov("Ship lost","You reached stage "+(S.st+1)+" of "+STG.length+" with "+S.gold+" gold.","Start over",newGame),1300)}
function clearStage(){const g=STG[S.st],r=REW[Math.random()*REW.length|0];
if(r[2]=="g")S.gold+=150;else if(r[2]=="g2")S.gold+=300;else if(r[2]=="r")S.extra=Math.min(S.extra+1,2);else if(r[2]=="s")S.shield++;else if(r[2]=="h")S.hint++;else S.skip++;
if(!g.b){S.cleared++;S.ship=SH[g.i]}const nx=STG[S.st+1];
$("trl").innerHTML=g.b?`<div class="lv"><span>Boss</span><b>Down</b></div>`:`<div class="lv"><span>Level</span><b>${S.cleared+1}</b></div>`;
$("trship").innerHTML=shipSVG(S.ship.slice(1),1);$("trn").textContent=g.b?"Hull repaired":S.ship[0];
$("trs").textContent=g.b?"The crew patches the damage.":g.i==0?"The haunted ship joins your voyage.":"Your ship is rebuilt from the island’s legend.";
$("trp").innerHTML=`Reward: <b>${r[0]}</b>, ${r[1]}`+(nx?`<br>Next: ${nx.b?"Boss, "+nx.name:"Island "+(nx.i+1)+", "+nx.name}`:"");
$("tr").classList.remove("on");void $("tr").offsetWidth;$("tr").classList.add("on")}
$("trb").onclick=()=>{$("tr").classList.remove("on");S.st++;if(S.st>=STG.length){S.st--;return ov("Voyage complete","Every island and boss is behind you. Final gold: "+S.gold+".","Sail again",newGame)}
S.ok=0;S.bad=0;cur=draw(tier());phase="ask";say("");enter();render()};
$("hint").onclick=()=>{if(!S.hint)return;S.hint--;const k=cur[2].split(",")[0];say(`Starts with <b>${k[0].toUpperCase()}</b>, ${k.length} letters.`);render()};
$("skip").onclick=()=>{if(!S.skip)return;S.skip--;cur=draw(ct);say("Question skipped.");render()};
$("fire").onclick=()=>fire();$("next").onclick=next;
$("ans").addEventListener("keydown",e=>{if(e.key=="Enter"){e.preventDefault();fire()}});
$("hship").innerHTML=shipSVG(["#7a4b22","#f2ead8","#c9892b"]);
$("play").onclick=()=>{$("home").classList.remove("on");newGame()};
</script></body></html>
